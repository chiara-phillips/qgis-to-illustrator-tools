[project]
name = "qgis-to-illustrator-tools"
version = "0.3.0"
description = "Helper scripts for processing and exporting CMS data."
authors = [{ name = "Chiara Phillips" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "copernicusmarine>=2.0.1,<3",
    "dask>=2025.3.0,<2026",
    "geodatasets>=2024.8.0,<2025",
    "geopandas>=1.0.1,<2",
    "ipykernel>=6.29.5,<7",
    "loguru>=0.7.2,<1",
    "matplotlib>=3.8.0,<4",
    "notebook>=7,<8",
    "numpy>=2.2.0,<3",
    "pandas>=2.2.0,<3",
    "pyproj>=3.7.1,<3.8",
    "rasterio>=1.4.0,<1.4.4",
    "rioxarray>=0.18.2,<0.19",
    "shapely>=2.0.0,<3",
    "tqdm>=4.67.1,<5",
    "xarray>=2025.3.0,<2026",
]

[dependency-groups]
dev = ["pre-commit>=4.2.0,<5", "ruff>=0.17.0,<0.18"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qgis_to_illustrator_tools"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
